<svg viewBox="0 0 680 300" width="680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, PingFang SC, sans-serif">
  <rect width="680" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="14" font-weight="500" fill="#26215C">一对相似三角形：左边是「画面能装下的实物宽度 W」，右边是「传感器宽 S」</text>
  <circle cx="300" cy="150" r="6" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="300" y="130" font-size="12" fill="#5F5E5A" text-anchor="middle">镜头中心</text>
  <path d="M300 150 L90 80 L90 220 Z" fill="#FAC775" fill-opacity="0.28" stroke="#BA7517" stroke-width="1"/>
  <rect x="84" y="74" width="8" height="152" rx="2" fill="#BA7517" stroke="#854F0B" stroke-width="0.5"/>
  <text x="60" y="66" font-size="12" fill="#5F5E5A">实物宽度 W</text>
  <path d="M300 150 L500 124 L500 176 Z" fill="#9FE1CB" fill-opacity="0.35" stroke="#0F6E56" stroke-width="1"/>
  <rect x="494" y="118" width="8" height="64" rx="2" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="516" y="150" font-size="12" fill="#5F5E5A">传感器宽 S</text>
  <path d="M100 246 H286" stroke="#888780" stroke-width="1" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="193" y="266" font-size="12" fill="#5F5E5A" text-anchor="middle">物距 u</text>
  <path d="M310 246 H494" stroke="#888780" stroke-width="1" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="402" y="266" font-size="12" fill="#5F5E5A" text-anchor="middle">像距 v</text>
  <text x="40" y="292" font-size="13" fill="#26215C">S / W = v / u　→　W = S × u / v　→　拍远处 v≈f，得 W = S × u / f</text>
</svg>
