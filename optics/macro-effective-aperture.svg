<svg viewBox="0 0 680 400" width="680" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, PingFang SC, sans-serif">
  <rect width="680" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
  <text x="40" y="34" font-size="14" font-weight="500" fill="#26215C">上：光锥拉长一倍，投影面积按平方放大到 4 倍，亮度变 1/4</text>
  <rect x="60" y="52" width="8" height="52" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="64" y="46" font-size="12" fill="#5F5E5A" text-anchor="middle">孔径 D</text>
  <path d="M70 66 L280 58 L280 98 L70 90 Z" fill="#9FE1CB" fill-opacity="0.35" stroke="#0F6E56" stroke-width="1"/>
  <rect x="284" y="56" width="7" height="44" rx="2" fill="#1D9E75" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="304" y="78" font-size="12" fill="#5F5E5A">光斑面积 A，亮度 ∝ D²/f²</text>
  <path d="M74 120 H280" stroke="#888780" stroke-width="1" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="177" y="138" font-size="12" fill="#5F5E5A" text-anchor="middle">v = f（对焦无穷远）</text>

  <rect x="380" y="52" width="8" height="52" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="384" y="46" font-size="12" fill="#5F5E5A" text-anchor="middle">孔径 D</text>
  <path d="M390 62 L600 42 L600 114 L390 94 Z" fill="#FAC775" fill-opacity="0.4" stroke="#BA7517" stroke-width="1"/>
  <rect x="604" y="38" width="7" height="80" rx="2" fill="#BA7517" stroke="#854F0B" stroke-width="0.5"/>
  <text x="624" y="78" font-size="12" fill="#5F5E5A">光斑 ≈ 4A</text>
  <text x="624" y="96" font-size="12" fill="#5F5E5A">亮度 1/4</text>
  <path d="M394 120 H600" stroke="#888780" stroke-width="1" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="497" y="138" font-size="12" fill="#5F5E5A" text-anchor="middle">v = 2f（1:1 微距）</text>

  <text x="40" y="186" font-size="14" font-weight="500" fill="#26215C">下：换个方向看——从传感器一点回看光圈，孔退远一倍就「小一半」</text>
  <rect x="90" y="206" width="8" height="34" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <text x="94" y="200" font-size="12" fill="#5F5E5A" text-anchor="middle">光圈 D</text>
  <path d="M100 214 L300 218" stroke="#0F6E56" stroke-width="1.1" fill="none"/>
  <path d="M100 232 L300 228" stroke="#0F6E56" stroke-width="1.1" fill="none"/>
  <circle cx="304" cy="223" r="4" fill="#E24B4A"/>
  <text x="316" y="223" font-size="12" fill="#5F5E5A">传感器上的一点</text>
  <path d="M104 250 H296" stroke="#888780" stroke-width="1" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="200" y="268" font-size="12" fill="#5F5E5A" text-anchor="middle">距离 = f：看起来大，收光多</text>

  <rect x="90" y="290" width="8" height="34" rx="2" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
  <path d="M100 300 L610 306" stroke="#BA7517" stroke-width="1.1" fill="none"/>
  <path d="M100 314 L610 310" stroke="#BA7517" stroke-width="1.1" fill="none"/>
  <circle cx="614" cy="308" r="4" fill="#E24B4A"/>
  <text x="626" y="308" font-size="12" fill="#5F5E5A">同一点</text>
  <path d="M104 334 H606" stroke="#888780" stroke-width="1" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="355" y="352" font-size="12" fill="#5F5E5A" text-anchor="middle">距离 = 2f：角直径减半，收光 1/4</text>
  <text x="40" y="386" font-size="13" fill="#26215C">传感器尺寸始终不变，变的是光的密度：每一点收到的光少 2 档</text>
</svg>
